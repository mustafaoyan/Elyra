[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elyra-pardus"
version = "1.0.2"
description = "Elyra: local-first, explainable entropy-based endpoint defense engine"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ELYRA / Elyra Team"}]
dependencies = [
  "numpy>=2.1,<3",
  "customtkinter>=5.2,<6",
  "matplotlib>=3.9,<4",
  "python-magic>=0.4.27,<0.5",
  "pyelftools>=0.31,<1",
]

[project.scripts]
elyra-daemon = "elyra.service.daemon:main"
elyra-gui = "elyra.gui.main:main"
elyra-preflight = "elyra.service.preflight:main"
elyra-install-check = "elyra.service.installation_check:main"
elyra-integration-check = "elyra.service.integration_check:main"
elyra-submission-check = "elyra.release.submission:main"
elyra-release-build = "elyra.release.bundle:main"
elyra-windows-local = "elyra.service.windows_local:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"elyra.config" = ["*.json"]
"elyra.monitor.ebpf" = ["probes.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: root, kernel, GUI or Pardus-dependent integration tests",
]
