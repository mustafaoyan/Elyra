[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siper-pardus"
version = "1.0.1"
description = "Siper: ELLIOT projesi kapsamında Pardus için entropi tabanlı, açıklanabilir savunma motoru"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ELLIOT / Siper Team"}]
dependencies = [
  "numpy>=2.1,<3",
  "customtkinter>=5.2,<6",
  "matplotlib>=3.9,<4",
  "python-magic>=0.4.27,<0.5",
  "pyelftools>=0.31,<1",
]

[project.scripts]
siper-daemon = "elliot.service.daemon:main"
siper-gui = "elliot.gui.main:main"
siper-preflight = "elliot.service.preflight:main"
siper-install-check = "elliot.service.installation_check:main"
siper-integration-check = "elliot.service.integration_check:main"
siper-submission-check = "elliot.release.submission:main"
siper-release-build = "elliot.release.bundle:main"
elliot-daemon = "elliot.service.daemon:main"
elliot-gui = "elliot.gui.main:main"
elliot-preflight = "elliot.service.preflight:main"
elliot-install-check = "elliot.service.installation_check:main"
elliot-integration-check = "elliot.service.integration_check:main"
elliot-submission-check = "elliot.release.submission:main"
elliot-release-build = "elliot.release.bundle:main"
elliot-windows-local = "elliot.service.windows_local:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"elliot.config" = ["*.json"]
"elliot.monitor.ebpf" = ["probes.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: root, kernel, GUI or Pardus-dependent integration tests",
]
