name: Build Linux release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian/Ubuntu package
        working-directory: elyra-engine
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-venv python3-tk libmagic1 build-essential
          python3 -m venv .release-venv
          . .release-venv/bin/activate
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel build
          test -f requirements.txt
          test -f LICENSE
          bash scripts/build_pardus_deb.sh dist/debian
      - name: Build portable Linux bundle
        working-directory: elyra-engine
        run: bash scripts/build_portable_linux_bundle.sh dist/portable
      - name: Build installable AI assistant package
        working-directory: elyra-engine
        run: bash scripts/build_ai_deb.sh dist/ai-debian
      - name: Generate release checksums
        working-directory: elyra-engine
        run: sha256sum dist/debian/*.deb > dist/debian/SHA256SUMS
      - name: Upload GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            elyra-engine/dist/debian/*.deb
            elyra-engine/dist/debian/SHA256SUMS
            elyra-engine/dist/portable/*.tar.gz
            elyra-engine/dist/portable/*.sha256
            elyra-engine/dist/ai-debian/*.deb
            elyra-engine/dist/ai-debian/*.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows AI installer
        working-directory: elyra-engine
        shell: powershell
        run: |
          python -m pip install --upgrade pip pyinstaller
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          python scripts/build_windows_ai_release.py --version $version --clean
      - name: Upload Windows AI installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            elyra-engine/dist/windows-ai/*.exe
            elyra-engine/dist/windows-ai/SHA256SUMS.txt
